name: release

# Publishes a GitHub Release for a version tag.
#
# Separate from publish.yml on purpose: a tag push builds and pushes the image,
# and this workflow writes the notes that go with it. Triggering on `workflow_run`
# rather than on the tag push itself means a Release only appears once the image
# build has actually succeeded — a failed build never leaves a Release claiming
# the version is available.
#
# No stored credential is involved: GITHUB_TOKEN is injected into every run.

on:
  workflow_run:
    workflows: ["publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a Release for (e.g. v13.2.5)"
        required: true

jobs:
  release:
    # The automatic path waits for publish.yml to succeed; the manual path has
    # nothing to wait for.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # workflow_dispatch takes the input; a tag push arrives as head_branch. A
      # publish run started from a branch rather than a tag resolves to a branch
      # name, which is not a release — the v* check rejects it.
      - name: Resolve the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.workflow_run.head_branch }}"
          fi
          case "$tag" in
            v*) echo "tag=$tag" >> "$GITHUB_OUTPUT" ;;
            *) echo "Not a version tag ($tag); nothing to release." ;;
          esac

      # fetch-depth 0 so generate_release_notes can diff against the previous tag.
      - name: Checkout
        if: steps.tag.outputs.tag != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Publish the Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true